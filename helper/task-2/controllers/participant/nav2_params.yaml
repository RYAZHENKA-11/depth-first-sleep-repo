planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [ "GridBased" ]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"

controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    failure_tolerance: 10.0
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.8
      min_linear_vel: -0.8
      max_angular_vel: 1.5
      min_angular_vel: -1.5
      lookahead_dist: 0.25

behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap
    global_costmap_topic: global_costmap/costmap
    behavior_plugins: [ "spin", "backup", "drive_on_heading", "wait" ]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    max_rotational_vel: 1.5
    min_rotational_vel: 0.25

bt_navigator:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    max_velocity: [ 0.8, 0.0, 1.5 ]
    min_velocity: [ -0.8, 0.0, -1.5 ]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.22
      plugins: [ "obstacle_layer", "inflation_layer" ]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 2.0
      robot_radius: 0.3
      resolution: 0.05
      plugins: [ "static_layer", "inflation_layer" ]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map_full"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.6
      always_send_full_costmap: True

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [ "controller_server", "planner_server", "behavior_server", "bt_navigator", "velocity_smoother" ]